<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>モンテカルロシミュレーション</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 30px; }
        canvas { border: 1px solid #333; background: #fff; margin-bottom: 20px; }
        .controls { margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        .result { font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>モンテカルロ法による円周率の推定</h1>
    
    <div class="controls">
        <button id="startBtn">シミュレーション開始</button>
        <button id="resetBtn">リセット</button>
    </div>

    <div>
        <canvas id="simCanvas" width="400" height="400"></canvas>
    </div>

    <div class="result">
        <p>試行回数: <span id="count">0</span></p>
        <p>推定された円周率: <span id="pi">0.000000</span></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
