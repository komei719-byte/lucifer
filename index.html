<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ルシファーの悪魔 シミュレーション</title>
    <style>
        body { font-family: sans-serif; margin: 40px; line-height: 1.6; }
        .results { margin-top: 20px; padding: 20px; background: #f4f4f4; border-radius: 8px; }
        .metric { margin-bottom: 10px; font-weight: bold; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>ルシファーの悪魔 戦略シミュレーター</h1>
    <button id="runBtn">シミュレーション実行</button>

    <div class="results" id="resultsArea" style="display: none;">
        <h2>シミュレーション結果（KPI）</h2>
        <div class="metric">実質破綻確率: <span id="failRate">-</span></div>
        <div class="metric">追加手出し額の分布: <span id="injectionDist">-</span></div>
        <div class="metric">税引き後 最終総資産額の分布: <span id="p50Asset">-</span></div>
        <div class="metric">累積納税総額: <span id="taxTotal">-</span></div>
    </div>

    <!-- スクリプトの読み込み -->
    <script src="script.js"></script>
</body>
</html>
